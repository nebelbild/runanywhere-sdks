# Follow Changes of Forked/Upstream Repository.
#
# This workflow rebase-marge changes from upstream's master to origin's master. 
# - Ref:
#   - https://stackoverflow.com/a/61574295/12102603 by N1ngu @ StackOverflow (EN)
#   - https://qiita.com/KEINOS/items/3bcaa6cea853f6b63475 by KEINOS @ Qiita (JA)

name: Merge upstream branches

# Triggers the action as scheduled
on:
  # Runs on 10 minutes past every hour（毎 n 時 10 分に実行）
  schedule:
    # Ref: 
    #   - https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule
    #   - https://crontab.guru/examples.html
    # Cron format:
    #         ┌───────────── minute (0 - 59)
    #         │ ┌───────────── hour (0 - 23)
    #         │ │ ┌───────────── day of the month (1 - 31)
    #         │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #         │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #         │ │ │ │ │                                   
    #         │ │ │ │ │
    #         │ │ │ │ │
    #         * * * * *
    - cron:  '10 */1 * * *'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        # 以下の設定を変更してください。REPO_FORK が fork 元です。
        env:
          NAME: nebelbild
          EMAIL: gjwbqwsh74@gmail.com
          REPO_FORK: https://github.com/RunanywhereAI/runanywhere-sdks.git
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_BRANCH: main
        # 追従処理
        run: |
          set -euo pipefail

          git config --global user.name ${NAME}
          git config --global user.email ${EMAIL}
          
          : # git rebase をデフォルトに設定
          git config --global pull.rebase merges

          : # actions/checkout の fetch-depth: 0 で全履歴を取得しているため、
          : # git pull --unshallow は不要
          # git pull --unshallow

          : # フォーク元のリポジトリをリモート先として "upstream" に命名
          git remote add upstream "${REPO_FORK}" || git remote set-url upstream "${REPO_FORK}"
          
          : # upstream のブランチをローカルに取得
          git fetch upstream "${UPSTREAM_BRANCH}"
          
          : # main ブランチの変更をマージし、clone 元の main に push
          : # コンフリクト時は失敗扱いにせず、次回実行で再試行する
          : # ブランチ名を main などに変更していたり、別のブランチにしている場合は注意

          git checkout "${TARGET_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "${TARGET_BRANCH}"; then
            echo "Already up to date with upstream/${UPSTREAM_BRANCH}"
            exit 0
          fi

          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            git merge --abort || true
            echo "::warning::Merge conflict detected. Skipping this run; resolve conflicts manually or wait for next run."
            exit 0
          fi

          : # race condition で push が失敗するケースに備えて1回だけrebaseして再push
          if ! git push origin "${TARGET_BRANCH}"; then
            echo "Push failed. Retrying once after rebase..."
            git pull --rebase origin "${TARGET_BRANCH}"
            git push origin "${TARGET_BRANCH}"
          fi
